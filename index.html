<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#faf9f7">
<title>知采笔记</title>
<style>
 html,body{overflow-x:hidden}
 body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
  background:#faf9f7;color:#2b2b2b;text-align:center;padding:24px 16px;box-sizing:border-box;
  font-family:"Segoe UI","Microsoft YaHei",system-ui,-apple-system,sans-serif}
 .box{width:340px;max-width:100%;box-sizing:border-box}
 .dot{width:10px;height:10px;border-radius:50%;background:#2f6f5e;display:inline-block;
  margin-right:8px;vertical-align:middle;animation:pulse 1.2s ease-in-out infinite}
 @keyframes pulse{0%,100%{opacity:.2}50%{opacity:1}}
 h1{font-size:17px;font-weight:650;margin:0 0 12px}
 p{color:#8a857c;font-size:13.5px;line-height:1.75;margin:0}
 input{width:100%;height:44px;margin-top:14px;padding:0 14px;border:1px solid #e5e1d8;
  border-radius:9px;font-size:16px;background:#fff;color:#2b2b2b;outline:none;text-align:center;
  box-sizing:border-box}
 input:focus{border-color:#2f6f5e}
 button{margin-top:14px;padding:11px 26px;border:1px solid #e5e1d8;border-radius:9px;
  background:#fff;color:#2b2b2b;font-size:14px;cursor:pointer}
 button.primary{background:#2f6f5e;border-color:#2f6f5e;color:#fff;width:100%}
 .hide{display:none}
</style>
</head>
<body>
<div class="box">
  <h1><span class="dot" id="dot"></span><span id="t">正在打开知采笔记</span></h1>
  <p id="m">正在读取最新地址…</p>

  <div id="ask" class="hide">
    <input id="k" type="password" inputmode="numeric" placeholder="输入访问口令"
      autocomplete="off" autocapitalize="off" spellcheck="false">
    <button class="primary" onclick="saveK()">记住并进入</button>
  </div>

  <button id="retry" class="hide" onclick="go()">重试</button>
</div>
<script>
const KEY = 'zc-k';
const DAYS = 10;
const TTL = DAYS * 24 * 60 * 60 * 1000;

// 从笔记页点「重新输入口令」回来时，把记错的口令清掉
if(location.hash === '#reset'){
  try{ localStorage.removeItem(KEY); }catch(e){}
  try{ history.replaceState(null, '', location.pathname); }catch(e){}
}

function loadSaved(pv){
  try{
    const o = JSON.parse(localStorage.getItem(KEY) || '{}');
    if(!o || !o.k) return '';
    if(pv && o.pv !== pv) return '';                 // 口令换过了，旧的不作数
    if(!o.exp || Date.now() > o.exp) return '';      // 超过 10 天没打开
    return o.k;
  }catch(e){ return ''; }
}

function saveK(){
  const v = (document.getElementById('k').value || '').trim();
  if(!v) return;
  window.__k = v;
  go();
}

function show(step, title, msg){
  document.getElementById('t').textContent = title;
  document.getElementById('m').innerHTML = msg;
  document.getElementById('ask').classList.toggle('hide', step !== 'ask');
  document.getElementById('retry').classList.toggle('hide', step !== 'off');
  document.getElementById('dot').style.background = step === 'off' ? '#b4402f' : '#2f6f5e';
}

async function go(){
  show('loading', '正在打开知采笔记', '正在读取最新地址…');

  let data = null;
  try{
    const r = await fetch('./latest.json?t=' + Date.now(), {cache:'no-store'});
    data = await r.json();
  }catch(e){}

  if(!data || !data.url || data.url.length < 10){
    show('off', '电脑上的笔记服务没开',
      '出门前在这台电脑上双击「出门模式.bat」，<br>等一分钟再点重试。');
    return;
  }

  const pv = data.pv || '';
  // 刚手输的口令优先，其次用本地记住的
  let k = window.__k || loadSaved(pv);
  if(!k){
    show('ask', '输入访问口令', '10 天内打开过就不用再输。');
    return;
  }

  // 记住 / 续期：用一次就往后推 10 天
  try{
    localStorage.setItem(KEY, JSON.stringify({k: k, pv: pv, exp: Date.now() + TTL}));
  }catch(e){}

  // 带时间戳：每次跳转都是新 URL，手机浏览器不会拿旧缓存糊弄
  const u = data.url + (data.url.indexOf('?') >= 0 ? '&' : '?')
    + 'k=' + encodeURIComponent(k) + '&t=' + Date.now();
  location.replace(u);
}

go();
</script>
</body>
</html>
